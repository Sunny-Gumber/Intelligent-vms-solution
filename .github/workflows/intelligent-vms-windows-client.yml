name: Intelligent VMS Windows Client

on:
  pull_request:
    paths:
      - 'intelligent-vms-v1/clients/windows/**'
      - 'intelligent-vms-v1/deploy/windows/installer/**'
      - 'intelligent-vms-v1/release/windows/**'
      - 'intelligent-vms-v1/qualification/windows/**'
      - 'intelligent-vms-v1/qualification/windows/**'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_CLIENT_FOUNDATION.md'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_LIVE_GRID.md'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_PLAYBACK_FOUNDATION.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_DESKTOP_LIVE_GRID_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_DESKTOP_PLAYBACK_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_DESKTOP_CLIENT_QA.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_DESKTOP_PLAYBACK_QA.md'
      - 'intelligent-vms-v1/docs/operations/WINDOWS_DESKTOP_CLIENT.md'
      - '.github/workflows/intelligent-vms-windows-client.yml'
  push:
    branches: [main]
    paths:
      - 'intelligent-vms-v1/clients/windows/**'
      - 'intelligent-vms-v1/deploy/windows/installer/**'
      - 'intelligent-vms-v1/release/windows/**'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_CLIENT_FOUNDATION.md'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_LIVE_GRID.md'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_DESKTOP_PLAYBACK_FOUNDATION.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_DESKTOP_LIVE_GRID_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_DESKTOP_PLAYBACK_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_DESKTOP_CLIENT_QA.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_DESKTOP_PLAYBACK_QA.md'
      - 'intelligent-vms-v1/docs/operations/WINDOWS_DESKTOP_CLIENT.md'
      - '.github/workflows/intelligent-vms-windows-client.yml'

permissions:
  contents: read

jobs:
  windows-client-foundation:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned client dependencies
        shell: pwsh
        run: dotnet restore clients/windows/src/IntelligentVMS.Desktop/IntelligentVMS.Desktop.csproj -p:Platform=x64
      - name: Audit client dependencies
        shell: pwsh
        run: |
          $audit = dotnet list clients/windows/src/IntelligentVMS.Desktop/IntelligentVMS.Desktop.csproj package --vulnerable --include-transitive
          $audit | Write-Host
          if($LASTEXITCODE -ne 0){throw "Client dependency audit failed"}
          if(($audit -join [Environment]::NewLine) -match 'has the following vulnerable packages'){throw "Vulnerable desktop dependency detected"}

      - name: Build x64 native desktop client
        shell: pwsh
        run: dotnet build clients/windows/src/IntelligentVMS.Desktop/IntelligentVMS.Desktop.csproj -c Release -p:Platform=x64 --no-restore -warnaserror
      - name: Build and run deterministic client tests
        shell: pwsh
        run: |
          dotnet build clients/windows/tests/IntelligentVMS.Desktop.Tests/IntelligentVMS.Desktop.Tests.csproj -c Release -p:Platform=x64
          dotnet run --project clients/windows/tests/IntelligentVMS.Desktop.Tests/IntelligentVMS.Desktop.Tests.csproj -c Release -p:Platform=x64 --no-build
      - name: Security contract scan
        shell: pwsh
        run: |
          $source=(Get-ChildItem clients/windows/src,clients/windows/packaging -Recurse -File | Where-Object {$_.Extension -in ".cs",".xaml",".html",".ps1"} | Get-Content -Raw) -join [Environment]::NewLine
          foreach($forbidden in @("ServerCertificateCustomValidationCallback","DangerousAcceptAnyServerCertificateValidator","AUTH_DISABLED=true","?token=")){
            if($source.Contains($forbidden)){throw "Forbidden client security pattern: $forbidden"}
          }
          if($source -match '(?i)ProgramData.*IntelligentVMS'){throw "Desktop client must not own server ProgramData state"}
          if($source -match '(?i)ClientSecret\s*='){throw "Public desktop client must not configure a client secret"}
          $oidc=Get-Content clients/windows/src/IntelligentVMS.Desktop/OidcAuthentication.cs -Raw
          if($oidc -notmatch 'UseShellExecute\s*=\s*true'){throw "OIDC authentication must use the system browser"}
          if($oidc -match 'WebView2'){throw "OIDC authentication must not use the media WebView2 boundary"}
          $grid=Get-Content clients/windows/src/IntelligentVMS.Desktop/LiveGrid.cs -Raw
          foreach($forbidden in @("rtsp://","access_token","refresh_token","code_verifier","password=")){
            if($grid -match [regex]::Escape($forbidden)){throw "Live-grid source contains forbidden secret/media pattern: $forbidden"}
          }
          if($grid -notmatch 'SupportedCounts=\[1,4,9,16\]'){throw "Native live-grid layout contract missing"}
          if($grid -match 'setInterval|while\s*\(\s*true\s*\)'){throw "Live-grid must not introduce automatic retry storms"}
          $playback=Get-Content clients/windows/src/IntelligentVMS.Desktop/Playback.cs -Raw
          foreach($forbidden in @("rtsp://","record_stream_key","segment_path","ProgramData")){
            if($playback -match [regex]::Escape($forbidden)){throw "Playback coordinator contains forbidden server/media coupling: $forbidden"}
          }
          $playbackRenderer=Get-Content clients/windows/src/IntelligentVMS.Desktop/Views/PlaybackMediaView.xaml.cs -Raw
          if($playbackRenderer -notmatch 'SetHeader\("Authorization"'){throw "Playback media requests must inject Authorization natively"}
          if($playbackRenderer -notmatch 'SameOrigin'){throw "Playback media must remain bound to the active VMS origin"}
          $playbackPage=Get-Content clients/windows/src/IntelligentVMS.Desktop/Media/playback.html -Raw
          foreach($secret in @("Authorization","access_token","refresh_token","code_verifier")){
            if($playbackPage -match [regex]::Escape($secret)){throw "Packaged playback page contains forbidden auth material: $secret"}
          }
          if($playbackPage -notmatch 'video\.currentTime'){throw "Playback position must originate from the media renderer"}
      - name: Publish deterministic win-x64 package
        shell: pwsh
        run: .\clients\windows\packaging\Publish-Client.ps1 -Version "0.1.${{ github.run_number }}" -OutputRoot "$env:RUNNER_TEMP\client-artifacts"
      - name: Launch smoke
        shell: pwsh
        run: |
          $exe=Get-ChildItem "$env:RUNNER_TEMP\client-artifacts\stage" -Recurse -Filter "IntelligentVMS.Desktop.exe" | Select-Object -First 1
          if(-not $exe){throw "Published desktop executable missing"}
          $process=Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -Wait -PassThru
          if($process.ExitCode -ne 0){throw "Desktop smoke launch failed: $($process.ExitCode)"}
      - name: Verify package isolation
        shell: pwsh
        run: |
          $zip=Get-ChildItem "$env:RUNNER_TEMP\client-artifacts" -Filter "*.zip" | Select-Object -First 1
          if(-not $zip){throw "Client ZIP artifact missing"}
          $hash=Get-Content "$($zip.FullName).sha256"
          if(-not $hash -or $hash.Length -lt 64){throw "Package SHA-256 missing"}
          $uninstall=Get-Content clients/windows/packaging/Uninstall-Client.ps1 -Raw
          foreach($forbidden in @("IntelligentVMSControl","IntelligentVMSMedia","PostgreSQL","ProgramData")){if($uninstall -match $forbidden){throw "Uninstall isolation violation: $forbidden"}}
      - uses: actions/upload-artifact@v4
        with:
          name: IntelligentVMS-DesktopClient-win-x64
          path: |
            ${{ runner.temp }}/client-artifacts/*.zip
            ${{ runner.temp }}/client-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
