name: Intelligent VMS Windows Installer

on:
  pull_request:
    paths:
      - 'intelligent-vms-v1/deploy/windows/**'
      - 'intelligent-vms-v1/clients/windows/**'
      - 'intelligent-vms-v1/release/windows/**'
      - 'intelligent-vms-v1/tests/test_windows_unified_installer.py'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_UNIFIED_FIELD_TEST_INSTALLER.md'
      - 'intelligent-vms-v1/docs/operations/WINDOWS_UNIFIED_FIELD_TEST_SETUP.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_UNIFIED_INSTALLER_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_UNIFIED_INSTALLER_QA.md'
      - 'intelligent-vms-v1/docs/product/FEATURE_CATALOG.csv'
      - 'intelligent-vms-v1/docs/program/PROJECT_HANDOFF.md'
      - 'intelligent-vms-v1/docs/program/VMS_BOSS_STATE.md'
      - 'intelligent-vms-v1/docs/program/IMPLEMENTATION_HISTORY.md'
      - '.github/workflows/intelligent-vms-windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'intelligent-vms-v1/deploy/windows/**'
      - 'intelligent-vms-v1/clients/windows/**'
      - 'intelligent-vms-v1/release/windows/**'
      - 'intelligent-vms-v1/tests/test_windows_unified_installer.py'
      - 'intelligent-vms-v1/docs/architecture/ADR_WINDOWS_UNIFIED_FIELD_TEST_INSTALLER.md'
      - 'intelligent-vms-v1/docs/operations/WINDOWS_UNIFIED_FIELD_TEST_SETUP.md'
      - 'intelligent-vms-v1/docs/security/WINDOWS_UNIFIED_INSTALLER_SECURITY_REVIEW.md'
      - 'intelligent-vms-v1/docs/testing/WINDOWS_UNIFIED_INSTALLER_QA.md'
      - 'intelligent-vms-v1/docs/product/FEATURE_CATALOG.csv'
      - 'intelligent-vms-v1/docs/program/PROJECT_HANDOFF.md'
      - 'intelligent-vms-v1/docs/program/VMS_BOSS_STATE.md'
      - 'intelligent-vms-v1/docs/program/IMPLEMENTATION_HISTORY.md'
      - '.github/workflows/intelligent-vms-windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 -y --no-progress
          if($LASTEXITCODE -ne 0){throw "Pinned NSIS installation failed"}
          $makensis=Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "NSIS\makensis.exe"
          & $makensis /VERSION
      - name: Static installer contract tests
        shell: pwsh
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pytest -q tests/test_windows_unified_installer.py tests/test_windows_field_test_release.py
      - name: Build field-test setup and checksum
        shell: pwsh
        run: |
          .\deploy\windows\installer\Build-Installer.ps1 -OutputRoot "$env:RUNNER_TEMP\installer" -CommitSha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate artifact metadata
        shell: pwsh
        run: |
          $exe=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "IntelligentVMS-FieldTest-Setup-x64-*.exe"|Select-Object -First 1
          if(-not $exe){throw "Setup artifact missing"}
          $sum=Get-Content "$($exe.FullName).sha256" -Raw
          if($sum -notmatch '^[0-9a-f]{64}\s+'){throw "SHA-256 artifact invalid"}
          $info=(Get-Item $exe.FullName).VersionInfo
          if($info.ProductName -ne "Intelligent VMS Field-Test Setup"){throw "Setup version metadata invalid"}
      - uses: actions/upload-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: |
            ${{ runner.temp }}/installer/IntelligentVMS-FieldTest-Setup-x64-*.exe
            ${{ runner.temp }}/installer/IntelligentVMS-FieldTest-Setup-x64-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  lifecycle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        mode: [client, server, both]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: ${{ runner.temp }}/installer
      - name: Install selected mode
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Recordings"
          New-Item -ItemType Directory -Force -Path $record|Out-Null
          "recording-sentinel" | Set-Content (Join-Path $record "preserve.me")
          $mode="${{ matrix.mode }}"
          Remove-Item Env:PGBIN -ErrorAction SilentlyContinue
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=$mode","/RECORDINGROOT=$record") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Setup failed mode=$mode exit=$($p.ExitCode)"}
          if($mode -in @("server","both")){
            $setupLog=Get-Content "$env:ProgramData\IntelligentVMS\installer-logs\setup.log" -Raw
            if($setupLog -notmatch "windows_field_test_stage=postgres_discovery source="){throw "PostgreSQL discovery evidence missing"}
            if($setupLog -match "source=PGBIN"){throw "Normal lifecycle unexpectedly depended on PGBIN"}
            $services=Get-Service IntelligentVMSControl,IntelligentVMSMedia
            if($services.Where({$_.Status -ne "Running"})){throw "Server services unhealthy"}
            & "$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1" -Action Health
            if(-not $?){throw "Server health failed"}
          } else {
            if(Get-Service IntelligentVMSControl -ErrorAction SilentlyContinue){throw "Client-only install touched server service"}
          }
          if($mode -in @("client","both")){
            $exe="$env:ProgramFiles\Intelligent VMS\Client\IntelligentVMS.Desktop.exe"
            if(-not (Test-Path $exe)){throw "Client executable missing"}
            $smoke=Start-Process $exe -ArgumentList "--smoke-test" -Wait -PassThru
            if($smoke.ExitCode -ne 0){throw "Client smoke failed"}
          }
      - name: Repair Both mode
        if: matrix.mode == 'both'
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Recordings"
          $config="$env:ProgramData\IntelligentVMS\config\vms.env"
          $before=(Get-FileHash -Algorithm SHA256 $config).Hash
          Remove-Item "$env:ProgramFiles\Intelligent VMS\Client\IntelligentVMS.Desktop.exe" -Force
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=both","/ACTION=repair","/RECORDINGROOT=$record") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Repair failed"}
          if(-not (Test-Path "$env:ProgramFiles\Intelligent VMS\Client\IntelligentVMS.Desktop.exe")){throw "Repair did not restore client binary"}
          $after=(Get-FileHash -Algorithm SHA256 $config).Hash
          if($before -ne $after){throw "Repair unexpectedly replaced protected server configuration"}
      - name: Validate secret-safe logs and backup
        if: matrix.mode == 'server' || matrix.mode == 'both'
        shell: pwsh
        run: |
          & "$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1" -Action Backup
          $envFile=Get-Content "$env:ProgramData\IntelligentVMS\config\vms.env"
          $log=Get-Content "$env:ProgramData\IntelligentVMS\installer-logs\setup.log" -Raw
          foreach($key in @("VMS_SECRET_KEY","AUTH_HS256_SECRET","RECORDING_HOOK_TOKEN","WINDOWS_POSTGRES_PASSWORD","LIVE_VIEW_TOKEN_PRIVATE_KEY_B64")){
            $line=$envFile|Where-Object{$_.StartsWith("$key=")}|Select-Object -First 1
            if($line){$value=$line.Substring($line.IndexOf("=")+1);if($value -and $log.Contains($value)){throw "Installer log leaked $key"}}
          }
      - name: Non-destructive uninstall
        shell: pwsh
        run: |
          $mode="${{ matrix.mode }}"
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Recordings"
          $clientData=Join-Path ([Environment]::GetFolderPath("LocalApplicationData")) "IntelligentVMS\Client"
          New-Item -ItemType Directory -Force -Path $clientData|Out-Null
          "client-state" | Set-Content (Join-Path $clientData "preserve.me")
          $un="$env:ProgramFiles\Intelligent VMS\Uninstall.exe"
          $p=Start-Process $un -ArgumentList "/S" -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Uninstall failed"}
          if(-not (Test-Path (Join-Path $clientData "preserve.me"))){throw "Client LocalAppData was deleted"}
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Recording data was deleted"}
          if($mode -in @("server","both")){
            if(Get-Service IntelligentVMSControl -ErrorAction SilentlyContinue){throw "Control service still installed"}
            if(Get-Service IntelligentVMSMedia -ErrorAction SilentlyContinue){throw "Media service still installed"}
            if(-not (Test-Path "$env:ProgramData\IntelligentVMS\config\vms.env")){throw "Server configuration was deleted"}
            if(-not (Test-Path "$env:ProgramData\IntelligentVMS\backups")){throw "Backups were deleted"}
            $pg=Get-Service -Name "postgresql-x64-*"|Sort-Object Name -Descending|Select-Object -First 1
            if($pg.Status -ne "Running"){throw "Shared PostgreSQL was stopped/removed"}
          }
      - name: Capture redacted installer failure evidence
        if: failure()
        shell: pwsh
        run: |
          $root=Join-Path $env:ProgramData "IntelligentVMS"
          $setupLog=Join-Path $root "installer-logs\setup.log"
          if(Test-Path $setupLog){Get-Content $setupLog -Tail 80}
          $collector=Join-Path $root "app\deploy\windows\Collect-WindowsDiagnostics.ps1"
          if(Test-Path $collector){
            try{
              & $collector | Out-Null
              $diag=Get-ChildItem "$root\diagnostics-*.zip" -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
              if($diag){
                $dest=Join-Path $env:RUNNER_TEMP "installer-failure-diag"
                Expand-Archive $diag.FullName $dest -Force
                foreach($name in @("control-api.log","mediamtx.log")){
                  $path=Join-Path $dest $name
                  if(Test-Path $path){Write-Host "=== $name ===";Get-Content $path -Tail 80}
                }
              }
            }catch{Write-Host "Redacted diagnostics unavailable: $($_.Exception.GetType().Name)"}
          }
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process IntelligentVMS.Desktop -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          $ctl="$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1"
          if(Test-Path $ctl){try{& $ctl -Action Uninstall}catch{}}

  component-ownership:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: ${{ runner.temp }}/installer
      - name: Preserve ownership when adding Client to Server
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Ownership-Recordings"
          New-Item -ItemType Directory -Force -Path $record|Out-Null
          "ownership-sentinel"|Set-Content (Join-Path $record "preserve.me")
          $server=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=server","/RECORDINGROOT=$record") -Wait -PassThru
          if($server.ExitCode -ne 0){throw "Initial Server install failed"}
          $client=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=client") -Wait -PassThru
          if($client.ExitCode -ne 0){throw "Client add-on install failed"}
          $state=Get-Content "$env:ProgramData\IntelligentVMS\installer-state.json" -Raw|ConvertFrom-Json
          if($state.components -ne "Both"){throw "Combined component ownership was not preserved"}
          if($state.recording_root -ne $record){throw "Server recording ownership was lost while adding Client"}
          $un="$env:ProgramFiles\Intelligent VMS\Uninstall.exe"
          $remove=Start-Process $un -ArgumentList "/S" -Wait -PassThru
          if($remove.ExitCode -ne 0){throw "Combined uninstall failed"}
          if(Get-Service IntelligentVMSControl -ErrorAction SilentlyContinue){throw "Combined uninstall left Control service behind"}
          if(Get-Service IntelligentVMSMedia -ErrorAction SilentlyContinue){throw "Combined uninstall left Media service behind"}
          if(Test-Path "$env:ProgramFiles\Intelligent VMS\Client\IntelligentVMS.Desktop.exe"){throw "Combined uninstall left Client binary behind"}
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Combined uninstall deleted recordings"}
          if(-not (Test-Path "$env:ProgramData\IntelligentVMS\config\vms.env")){throw "Combined uninstall deleted server configuration"}
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process IntelligentVMS.Desktop -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          $ctl="$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1"
          if(Test-Path $ctl){try{& $ctl -Action Uninstall}catch{}}

  fresh-install-retry:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        fail_stage: [before_config, config_generated, role_ready]
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: ${{ runner.temp }}/installer
      - name: Inject bounded fresh-install failure
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
          VMS_INSTALLER_TEST_FAIL_STAGE: ${{ matrix.fail_stage }}
        run: |
          Remove-Item Env:PGBIN -ErrorAction SilentlyContinue
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Retry-Recordings"
          New-Item -ItemType Directory -Force -Path $record|Out-Null
          "retry-sentinel"|Set-Content (Join-Path $record "preserve.me")
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=server","/RECORDINGROOT=$record") -Wait -PassThru
          $sw.Stop()
          if($p.ExitCode -eq 0){throw "Injected failure unexpectedly passed"}
          if($sw.Elapsed.TotalMinutes -gt 20){throw "Injected failure was not bounded"}
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Failure rollback deleted recording data"}
          $envFile="$env:ProgramData\IntelligentVMS\config\vms.env"
          if("${{ matrix.fail_stage }}" -eq "before_config"){
            if(Test-Path $envFile){throw "before_config failure unexpectedly created vms.env"}
          } else {
            if(-not (Test-Path $envFile)){throw "Expected preserved vms.env missing"}
            $envHash=(Get-FileHash -Algorithm SHA256 $envFile).Hash
            $envHash|Set-Content "$env:RUNNER_TEMP\vms-env-before.txt"
          }
      - name: Retry same installer without manual repair
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          Remove-Item Env:VMS_INSTALLER_TEST_FAIL_STAGE -ErrorAction SilentlyContinue
          Remove-Item Env:PGBIN -ErrorAction SilentlyContinue
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Retry-Recordings"
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=server","/RECORDINGROOT=$record") -Wait -PassThru
          if($p.ExitCode -ne 0){
            $log="$env:ProgramData\IntelligentVMS\installer-logs\setup.log"
            if(Test-Path $log){Get-Content $log -Tail 160}
            throw "Fresh-install retry failed"
          }
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Retry lost recording data"}
          $state=Get-Content "$env:ProgramData\IntelligentVMS\bootstrap-state.json" -Raw|ConvertFrom-Json
          if($state.phase -ne "completed"){throw "Bootstrap state did not reach completed"}
          $beforeFile="$env:RUNNER_TEMP\vms-env-before.txt"
          if(Test-Path $beforeFile){
            $before=(Get-Content $beforeFile -Raw).Trim()
            $after=(Get-FileHash -Algorithm SHA256 "$env:ProgramData\IntelligentVMS\config\vms.env").Hash
            if($before -ne $after){throw "Retry rotated preserved vms.env"}
          }
          & "$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1" -Action Health
          if(-not $?){throw "Retry health validation failed"}
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ctl="$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1"
          if(Test-Path $ctl){try{& $ctl -Action Uninstall}catch{}}

  quiet-credential-negative:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: ${{ runner.temp }}/installer
      - name: Missing quiet PostgreSQL credential fails fast
        shell: pwsh
        run: |
          Remove-Item Env:VMS_POSTGRES_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:PGBIN -ErrorAction SilentlyContinue
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-NoCredential-Recordings"
          New-Item -ItemType Directory -Force -Path $record|Out-Null
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=server","/RECORDINGROOT=$record") -Wait -PassThru
          $sw.Stop()
          if($p.ExitCode -eq 0){throw "Quiet install unexpectedly passed without PostgreSQL credential"}
          if($sw.Elapsed.TotalMinutes -gt 5){throw "Missing-credential failure was not fast/bounded"}
          $log="$env:ProgramData\IntelligentVMS\installer-logs\setup.log"
          if(-not (Test-Path $log)){throw "Expected setup.log missing"}
          $text=Get-Content $log -Raw
          if($text -notmatch "hidden prompting is disabled"){throw "Missing-credential error was not actionable"}
          if($text -match "root"){throw "Credential value leaked to setup.log"}

  upgrade-and-negative:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: intelligent-vms-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fd7167d7915185d440913d7c10c38d03aaec89c6
          path: accepted-baseline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: IntelligentVMS-FieldTest-Setup-x64
          path: ${{ runner.temp }}/installer
      - name: Accepted-baseline upgrade simulation
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Upgrade-Recordings"
          New-Item -ItemType Directory -Force -Path $record|Out-Null
          "upgrade-sentinel"|Set-Content (Join-Path $record "preserve.me")
          $baseline=Join-Path $env:GITHUB_WORKSPACE "accepted-baseline\intelligent-vms-v1"
          $runtime=Join-Path $baseline "deploy\windows\runtime"
          New-Item -ItemType Directory -Force -Path $runtime|Out-Null
          $media=Join-Path $runtime "mediamtx_v1.21.1_windows_amd64.zip"
          $url="https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_windows_amd64.zip"
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 240 -o $media $url
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $media)){throw "Legacy upgrade fixture MediaMTX download failed"}
          $mediaHash=(Get-FileHash -Algorithm SHA256 $media).Hash.ToLowerInvariant()
          if($mediaHash -ne "faa97974861eb75a68b5aa326c78e7e7a6f670b5ef191bace78e715130381f23"){throw "Legacy upgrade fixture MediaMTX hash mismatch"}
          & (Join-Path $baseline "deploy\windows\Install-WindowsFieldTest.ps1") -RecordingRoot $record -CameraCidr "127.0.0.1/32"
          .\clients\windows\packaging\Publish-Client.ps1 -Version "0.1.0" -OutputRoot "$env:RUNNER_TEMP\old-client"
          $old=Get-ChildItem "$env:RUNNER_TEMP\old-client\stage" -Directory|Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:ProgramFiles\Intelligent VMS\Client"|Out-Null
          Copy-Item "$($old.FullName)\App\*" "$env:ProgramFiles\Intelligent VMS\Client" -Recurse -Force
          @{version="0.1.0.0";commit="accepted-baseline";components="Both";recording_root=$record}|ConvertTo-Json|Set-Content "$env:ProgramData\IntelligentVMS\installer-state.json"
          $before=(Get-FileHash "$env:ProgramData\IntelligentVMS\config\vms.env").Hash
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=both","/ACTION=upgrade","/RECORDINGROOT=$record") -Wait -PassThru
          if($p.ExitCode -ne 0){
            $setupLog="$env:ProgramData\IntelligentVMS\installer-logs\setup.log"
            if(Test-Path $setupLog){Get-Content $setupLog -Tail 120}
            throw "Upgrade simulation failed exit=$($p.ExitCode)"
          }
          $after=(Get-FileHash "$env:ProgramData\IntelligentVMS\config\vms.env").Hash
          if($before -ne $after){throw "Upgrade replaced protected configuration"}
          $installedMedia="$env:ProgramData\IntelligentVMS\runtime\mediamtx\mediamtx.exe"
          if((Get-FileHash -Algorithm SHA256 $installedMedia).Hash.ToLowerInvariant() -ne "bde9af1cdf4d0d662dc93d881ea4e62c3e8b35c019b62bf68de5df9b442561ed"){throw "Upgrade did not replace the accepted-baseline media runtime"}
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Upgrade lost recording data"}
          & "$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1" -Action Health
          if(-not $?){throw "Upgrade server health failed"}
      - name: Unsafe downgrade is blocked
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          $state="$env:ProgramData\IntelligentVMS\installer-state.json"
          $obj=Get-Content $state -Raw|ConvertFrom-Json
          $obj.version="9.0.0.0";$obj|ConvertTo-Json|Set-Content $state
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $record=Join-Path $env:RUNNER_TEMP "IntelligentVMS-Upgrade-Recordings"
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=both","/RECORDINGROOT=$record") -Wait -PassThru
          if($p.ExitCode -eq 0){throw "Unsafe downgrade was not blocked"}
          if(-not (Test-Path (Join-Path $record "preserve.me"))){throw "Downgrade rejection changed recording data"}
      - name: Invalid UNC fails before install mutation
        shell: pwsh
        env:
          VMS_POSTGRES_ADMIN_PASSWORD: root
        run: |
          Remove-Item "$env:ProgramData\IntelligentVMS\installer-state.json" -Force -ErrorAction SilentlyContinue
          $setup=Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter "*.exe"|Select-Object -First 1
          $p=Start-Process $setup.FullName -ArgumentList @("/S","/MODE=server","/RECORDINGROOT=\\server\share") -Wait -PassThru
          if($p.ExitCode -eq 0){throw "UNC path was not rejected"}
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ctl="$env:ProgramData\IntelligentVMS\app\deploy\windows\Vms-Windows.ps1"
          if(Test-Path $ctl){try{& $ctl -Action Uninstall}catch{}}
