name: Forensic Enhancement

on:
  pull_request:
    paths:
      - "intelligent-vms-v1/services/forensic_worker/**"
      - "intelligent-vms-v1/tests/test_forensic_enhancement.py"
      - "intelligent-vms-v1/tests/test_forensic_jobs.py"
      - "intelligent-vms-v1/services/control-api/app/**"
      - "intelligent-vms-v1/tests/forensic_preview_test.cjs"
      - "intelligent-vms-v1/web/index.html"
      - "intelligent-vms-v1/web/forensic-preview.js"
      - "intelligent-vms-v1/web/forensic-ui.js"
      - ".github/workflows/forensic-enhancement-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-worker:
    name: CPU derivative and provenance regression
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install FFmpeg and pytest on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pytest==9.1.1
      - name: Install FFmpeg and pytest on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          python -m pip install pytest==9.1.1
      - name: Verify CPU filtering capabilities
        shell: bash
        run: |
          ffmpeg -hide_banner -filters | grep -E 'histeq|hqdn3d|unsharp| eq '
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Install pinned API test dependencies
        working-directory: intelligent-vms-v1
        run: python -m pip install -r tests/requirements.txt
      - name: Compile worker and tests
        working-directory: intelligent-vms-v1
        run: python -m compileall -q services/forensic_worker/enhance.py tests/test_forensic_enhancement.py
      - name: Run synthetic media and negative tests
        working-directory: intelligent-vms-v1
        run: python -m pytest -q tests/test_forensic_enhancement.py tests/test_forensic_jobs.py tests/test_frontend_syntax.py
      - name: Test VMS forensic playback preview
        working-directory: intelligent-vms-v1
        run: node tests/forensic_preview_test.cjs

      - name: Build isolated worker for real container regression
        if: runner.os == 'Linux'
        working-directory: intelligent-vms-v1
        run: docker build --iidfile "$RUNNER_TEMP/forensic-image-id" -f services/forensic_worker/Dockerfile services/forensic_worker
      - name: Verify actual isolated job execution and cleanup
        if: runner.os == 'Linux'
        working-directory: intelligent-vms-v1
        run: |
          export VMS_FORENSIC_TEST_IMAGE="$(cat "$RUNNER_TEMP/forensic-image-id")"
          python -m pytest -q tests/test_forensic_container.py

      - name: Record exact forensic FFmpeg build and license flags
        if: runner.os == 'Linux'
        working-directory: intelligent-vms-v1
        run: |
          set -euo pipefail
          worker_id="$(cat "$RUNNER_TEMP/forensic-image-id")"
          docker image inspect "$worker_id" >/dev/null
          docker run --rm --entrypoint ffmpeg "$worker_id" -hide_banner -buildconf
          docker run --rm --entrypoint ffmpeg "$worker_id" -hide_banner -encoders | grep -F libx264
          docker run --rm --entrypoint dpkg-query "$worker_id" -W ffmpeg libavcodec59 libx264-164

      - name: Audit exact forensic worker image for HIGH/CRITICAL vulnerabilities
        if: runner.os == 'Linux'
        working-directory: intelligent-vms-v1
        run: |
          set -euo pipefail
          worker_id="$(cat "$RUNNER_TEMP/forensic-image-id")"
          docker image inspect "$worker_id" >/dev/null
          docker image tag "$worker_id" intelligent-vms-forensic-ci:review
          docker pull aquasec/trivy:0.74.0
          mkdir -p "$HOME/.cache/trivy"
          echo "Report all HIGH/CRITICAL findings in the exact built forensic image"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.74.0 image \
            --exit-code 0 --severity HIGH,CRITICAL intelligent-vms-forensic-ci:review
          echo "Fail closed for fixable HIGH/CRITICAL findings in the forensic image"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.74.0 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL intelligent-vms-forensic-ci:review
