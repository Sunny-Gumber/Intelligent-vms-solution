<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><style>html,body,video{margin:0;width:100%;height:100%;background:#000}video{object-fit:contain}</style></head>
<body><video id="video" autoplay playsinline muted></video><script>
'use strict';
let pc=null,sessionUrl=null,accessToken=null,generation=0;
const send=state=>chrome.webview.postMessage({state});
function safeMediaBase(raw){const u=new URL(raw);if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw new Error('unsafe media endpoint');return u}
async function waitIce(peer){if(peer.iceGatheringState==='complete')return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{peer.removeEventListener('icegatheringstatechange',change);reject(new Error('ICE timeout'))},5000);const change=()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);peer.removeEventListener('icegatheringstatechange',change);resolve()}};peer.addEventListener('icegatheringstatechange',change)})}
async function stop(expected){if(expected!==undefined&&expected!==generation)return;generation++;const oldPc=pc,oldUrl=sessionUrl,oldToken=accessToken;pc=null;sessionUrl=null;accessToken=null;document.getElementById('video').srcObject=null;if(oldPc){try{oldPc.ontrack=null;oldPc.onconnectionstatechange=null;oldPc.close()}catch{}}if(oldUrl&&oldToken){try{await fetch(oldUrl,{method:'DELETE',headers:{Authorization:'Bearer '+oldToken},keepalive:true})}catch{}}send('IDLE')}
async function start(message){await stop();const mine=++generation;send('CONNECTING');try{const base=safeMediaBase(message.webrtcUrl);accessToken=String(message.accessToken||'');if(!accessToken)throw new Error('missing media grant');const whep=new URL(base.toString().replace(/\/$/,'')+'/whep');pc=new RTCPeerConnection();pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{if(mine===generation&&e.streams&&e.streams[0])document.getElementById('video').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(mine!==generation)return;if(pc.connectionState==='connected')send('LIVE');if(['failed','disconnected','closed'].includes(pc.connectionState)){send('FAILED');stop(mine)}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);if(mine!==generation)return;await fetch(whep,{method:'OPTIONS',headers:{Authorization:'Bearer '+accessToken}});const response=await fetch(whep,{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/sdp'},body:pc.localDescription.sdp});if(response.status!==201)throw new Error('WHEP rejected');const location=response.headers.get('Location');if(location){const candidate=new URL(location,whep);if(candidate.origin!==whep.origin)throw new Error('cross-origin session');sessionUrl=candidate.toString()}const answer=await response.text();if(mine!==generation)return;await pc.setRemoteDescription({type:'answer',sdp:answer})}catch{if(mine===generation){send('FAILED');await stop(mine)}}}
chrome.webview.addEventListener('message',e=>{const m=e.data||{};if(m.action==='start')start(m);else if(m.action==='stop')stop()});
window.addEventListener('pagehide',()=>stop());
</script></body></html>
