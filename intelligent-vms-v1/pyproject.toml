[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Incremental gate: correctness-critical Pyflakes/Pycodestyle rules plus
# whitespace hygiene. Broader style families can be enabled after measured debt
# is removed; no legacy violations are mass-suppressed here.
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "W191",
  "W291",
  "W292",
  "W293",
]
