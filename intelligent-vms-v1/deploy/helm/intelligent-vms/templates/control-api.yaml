apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "intelligent-vms.fullname" . }}-control-api
  labels:
    {{- include "intelligent-vms.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  replicas: {{ .Values.controlApi.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "intelligent-vms.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "intelligent-vms.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-api
    spec:
      serviceAccountName: {{ include "intelligent-vms.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-api
          image: "{{ .Values.controlApi.image.repository }}:{{ .Values.controlApi.image.tag }}"
          imagePullPolicy: {{ .Values.controlApi.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "intelligent-vms.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/system/healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/system/healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/system/healthz/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
      {{- with .Values.controlApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "intelligent-vms.fullname" . }}-control-api
  labels:
    {{- include "intelligent-vms.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  {{- if .Values.prometheus.scrape }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.prometheus.path | quote }}
    prometheus.io/port: {{ .Values.controlApi.service.port | quote }}
  {{- end }}
spec:
  type: {{ .Values.controlApi.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "intelligent-vms.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-api
  ports:
    - name: http
      port: {{ .Values.controlApi.service.port }}
      targetPort: http
      protocol: TCP
{{- if and .Values.controlApi.pdb.enabled (gt (int .Values.controlApi.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "intelligent-vms.fullname" . }}-control-api
  labels:
    {{- include "intelligent-vms.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.controlApi.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "intelligent-vms.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-api
{{- end }}
