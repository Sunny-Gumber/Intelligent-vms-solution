{{- if .Values.externalSecrets.central.enabled }}
{{- if and (not .Values.externalSecrets.central.data) (not .Values.externalSecrets.central.dataFrom) }}
{{- fail "externalSecrets.central requires data or dataFrom" }}
{{- end }}
apiVersion: {{ .Values.externalSecrets.central.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "intelligent-vms.fullname" . }}-central
  labels:
    {{- include "intelligent-vms.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.central.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.central.secretStoreRef.name is required" .Values.externalSecrets.central.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.central.secretStoreRef.kind }}
  target:
    name: {{ required "existingSecret is required for central ExternalSecret" .Values.existingSecret }}
    creationPolicy: Owner
  {{- with .Values.externalSecrets.central.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.central.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.externalSecrets.regional.enabled }}
{{- if and (not .Values.externalSecrets.regional.data) (not .Values.externalSecrets.regional.dataFrom) }}
{{- fail "externalSecrets.regional requires data or dataFrom" }}
{{- end }}
---
apiVersion: {{ .Values.externalSecrets.regional.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "intelligent-vms.fullname" . }}-regional
  labels:
    {{- include "intelligent-vms.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.regional.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.regional.secretStoreRef.name is required" .Values.externalSecrets.regional.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.regional.secretStoreRef.kind }}
  target:
    name: {{ required "regional.existingSecret is required for regional ExternalSecret" .Values.regional.existingSecret }}
    creationPolicy: Owner
  {{- with .Values.externalSecrets.regional.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.regional.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
