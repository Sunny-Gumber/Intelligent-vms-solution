[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra --strict-markers
markers =
    slow: tests that take more than a few seconds
    ffmpeg: tests that require a working ffmpeg installation
    gateway: tests that drive a real MediaMTX binary (set VMS_IT_MEDIAMTX_BIN)
filterwarnings =
    ignore::DeprecationWarning
