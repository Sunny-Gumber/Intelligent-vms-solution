[project]
name = "vms-contracts"
version = "0.1.0"
description = "Shared, versioned contracts (enums + DTOs) for all Intelligent VMS services."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vms_contracts*"]
