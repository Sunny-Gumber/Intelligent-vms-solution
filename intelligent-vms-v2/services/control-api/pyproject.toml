[project]
name = "vms-control-api"
version = "0.1.0"
description = "Intelligent VMS control plane: identity, devices, recording orchestration, events, storage, administration."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "vms-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]
