/var/lib/intelligent-vms/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 vms vms
    sharedscripts
    # The application also rotates by size via RotatingFileHandler; this is
    # the belt-and-braces time-based policy operators expect to be able to
    # audit and adjust.
}
