# TLS termination for Intelligent VMS.
# The API binds loopback; this is the only public entry point.

upstream vms_api     { server 127.0.0.1:8080; }
upstream vms_webrtc  { server 127.0.0.1:8889; }
upstream vms_hls     { server 127.0.0.1:8888; }

server {
    listen 443 ssl http2;
    server_name vms.example.com;

    ssl_certificate     /etc/ssl/certs/vms.crt;
    ssl_certificate_key /etc/ssl/private/vms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Exports can be large; do not buffer them to disk twice.
    client_max_body_size 64m;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://vms_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket event stream
    location /api/v1/events/stream {
        proxy_pass http://vms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location /webrtc/ { proxy_pass http://vms_webrtc/; proxy_set_header Host $host; }
    location /hls/    { proxy_pass http://vms_hls/;    proxy_set_header Host $host; }

    location / { root /var/www/intelligent-vms; try_files $uri /index.html; }
}

server {
    listen 80;
    server_name vms.example.com;
    return 301 https://$host$request_uri;
}
